# Operational config: CommitScope pointed at its own repository.
#
# The pipeline is a strict one-directional flow. The only cross-stage import
# edges that are allowed are analyze -> collect (analyzers read git) and
# publish -> render (publishing renders markdown). Crucially, no stage may
# import narrate — a layer violation (R003) will flag it if one ever does.
layers:
  collect: ["commitscope/collect/**"]
  analyze: ["commitscope/analyze/**"]
  rules:   ["commitscope/rules/**"]
  narrate: ["commitscope/narrate/**"]
  render:  ["commitscope/render/**"]
  publish: ["commitscope/publish/**"]

allowed_edges:
  - [analyze, collect]
  - [publish, render]

skip_globs:
  - "docs/**"
  - "**/*.md"
  - "**/package-lock.json"
  - "**/poetry.lock"
  - "vendor/**"
  - "**/*.ipynb"

skip_merge_commits: true

blast_threshold: 5
max_files_changed: 100
max_lines_changed: 3000
max_files_indexed: 2000

source_roots:
  - "commitscope"

test_patterns:
  - "tests/**"

env_example_paths:
  - ".env.example"

doc_paths:
  - "README.md"
  - "ARCHITECTURE.md"

architecture_doc: "ARCHITECTURE.md"

run_timeout_seconds: 90
