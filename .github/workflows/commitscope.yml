name: CommitScope

# Observe pushes and post a per-commit analysis. This is an observer, never a
# gate: the action's CLI always exits 0. It also dogfoods the composite action
# defined at the repo root (uses: ./).
on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: write   # required to post commit comments

jobs:
  commitscope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need the parent commit or every diff fails

      - uses: ./
        with:
          # Optional: set this secret to enable the narration layer.
          api-key: ${{ secrets.COMMITSCOPE_API_KEY }}
