[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commitscope"
version = "0.1.0"
description = "Push-triggered commit analyzer with deterministic rules"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
commitscope = "commitscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["commitscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
